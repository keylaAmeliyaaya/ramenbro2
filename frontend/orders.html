<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Pesanan Saya - Ramen Bro</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>body{font-family:Epilogue,sans-serif;background:#f3f0eb}.status{font-size:10px;font-weight:800;padding:5px 9px;border-radius:999px}.paid{background:#e8f7ee;color:#25814a}.pending{background:#fff3d9;color:#93691d}.box{box-shadow:0 8px 30px rgba(0,0,0,.04)}</style></head><body class="flex justify-center min-h-screen bg-gray-100"><div class="w-full max-w-[414px] bg-[#fbf8f4] min-h-screen relative shadow-2xl"><header class="flex items-center justify-between px-6 py-6 border-b border-[#efe9dd] sticky top-0 bg-[#fbf8f4]/95 backdrop-blur z-20"><a href="homepage.html" class="w-9 h-9 rounded-full bg-white shadow-sm flex items-center justify-center text-[#a5151b]"><i class="fa-solid fa-arrow-left"></i></a><h1 class="font-extrabold text-[19px]">Pesanan Saya</h1><a href="checkoutpage.html" class="w-9 h-9 rounded-full bg-white shadow-sm flex items-center justify-center text-[#a5151b]"><i class="fa-solid fa-bag-shopping"></i></a></header><main class="px-6 py-6"><div class="bg-white rounded-[20px] p-5 box mb-5"><p class="text-[10px] font-bold tracking-widest text-[#8c8c8c] uppercase mb-2">Cek riwayat pesanan</p><div class="flex gap-2"><input id="phone" inputmode="tel" class="flex-1 bg-[#f6f4f0] rounded-xl p-3 text-[13px] outline-none" placeholder="Masukkan nomor HP"><button id="load" class="bg-[#8c0a13] text-white rounded-xl px-4 font-bold text-[12px]">Lihat</button></div></div><div id="list" class="flex flex-col gap-4"><div class="text-center text-[#8c8c8c] text-[13px] py-10">Masukkan nomor HP untuk melihat pesanan.</div></div></main></div><script src="cart.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const c=getCustomer();if(c.phone)document.getElementById('phone').value=c.phone;document.getElementById('load').onclick=loadOrders;if(c.phone)loadOrders();});async function loadOrders(){const phone=document.getElementById('phone').value.trim();if(!phone)return alert('Masukkan nomor HP dulu.');const list=document.getElementById('list');list.innerHTML='<div class="text-center text-[#8c8c8c] text-[13px] py-10">Memuat...</div>';try{const d=await apiJson('/orders?phone='+encodeURIComponent(phone));const orders=normalizeOrders(d);if(!orders.length){list.innerHTML='<div class="text-center text-[#8c8c8c] text-[13px] py-10">Belum ada pesanan dengan nomor ini.</div>';return;}list.innerHTML=orders.map(o=>{const paid=o.payment_status==='paid';const items=(o.items||[]).map(i=>`${i.product_name} x${i.qty}${i.variant?' · '+i.variant:''}`).join('<br>');return `<div class="bg-white rounded-[20px] p-5 box"><div class="flex justify-between items-start gap-3 mb-4"><div><p class="text-[10px] font-bold tracking-widest text-[#8c8c8c] uppercase">Kode Pesanan</p><h2 class="font-extrabold text-[18px] text-[#940a16]">${orderCodeFromId(o.id)}</h2><p class="text-[10px] text-[#8c8c8c] mt-1">${new Date(o.created_at).toLocaleString('id-ID')}</p></div><span class="status ${paid?'paid':'pending'}">${paid?'LUNAS':'MENUNGGU BAYAR'}</span></div><div class="bg-[#f6f4f0] rounded-xl p-3 text-[12px] text-[#555] leading-relaxed mb-4">${items}</div><div class="flex justify-between text-[13px]"><span class="text-[#777]">Status pesanan</span><b class="uppercase text-[#1a1a1a]">${o.status||'baru'}</b></div><div class="flex justify-between mt-2"><span class="text-[#777]">Total</span><b class="text-[#940a16]">${formatRupiah(o.total)}</b></div></div>`}).join('');}catch(e){list.innerHTML='<div class="text-center text-red-600 text-[13px] py-10">Gagal mengambil riwayat. Pastikan Laravel menyala.</div>';}}</script></body></html>
