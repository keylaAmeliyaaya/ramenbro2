<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Ramen Bro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Epilogue', sans-serif;
            background-color: #fbf8f4;
        }
        /* Latar belakang garis melengkung tipis (opsional) */
        .bg-swirl {
            background-image: url("data:image/svg+xml,%3Csvg width='414' height='400' viewBox='0 0 414 400' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M-50 150 C 100 50, 300 250, 450 100' stroke='%23e6dfd3' stroke-width='1.5' fill='none' opacity='0.5'/%3E%3Cpath d='M-50 200 C 150 100, 250 350, 450 200' stroke='%23e6dfd3' stroke-width='1.5' fill='none' opacity='0.5'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: top center;
        }
    </style>
</head>
<body class="flex justify-center min-h-screen bg-gray-100">

    <div class="w-full max-w-[414px] bg-[#fbf8f4] min-h-screen relative shadow-2xl flex flex-col bg-swirl pb-32">
        
        <header class="flex items-center justify-between px-6 py-6 sticky top-0 z-20 bg-[#fbf8f4]/95 backdrop-blur-sm border-b border-[#efe9dd]">
            <a href="homepage.html" class="w-9 h-9 rounded-full bg-white shadow-sm flex items-center justify-center text-[#a5151b] text-[15px]">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h1 class="font-extrabold text-[19px] text-[#1a1a1a] tracking-wide absolute left-1/2 transform -translate-x-1/2">
                Your Order
            </h1>
            <div class="w-9"></div> </header>

        <div class="px-6 pt-4 flex-1">
            
            <div class="mb-8 relative z-10">
                <div class="flex items-baseline gap-3 mb-6">
                    <span class="font-extrabold text-[36px] text-[#940a16] leading-none tracking-tighter">01</span>
                    <h2 class="font-extrabold text-[20px] text-[#1a1a1a] tracking-tight">Pesanan</h2>
                </div>

                <div class="flex flex-col gap-6" id="order-list"></div>

                <div id="empty-cart" class="hidden text-center py-10 px-4">
                    <i class="fa-solid fa-basket-shopping text-[#d1c8b8] text-[40px] mb-4"></i>
                    <p class="text-[#6b6b6b] text-[14px] font-medium mb-4">Keranjang kamu masih kosong.</p>
                    <a href="homepage.html" class="inline-block bg-[#8c0a13] text-white rounded-full px-6 py-2.5 text-[13px] font-bold">Lihat Menu</a>
                </div>
            </div>

            <div id="summary-section">
                <div class="border-t-[1.5px] border-dashed border-[#d1c8b8] my-8 relative z-10"></div>

                <div class="mb-6 relative z-10">
                    <div class="flex items-baseline gap-3 mb-6">
                        <span class="font-extrabold text-[36px] text-[#940a16] leading-none tracking-tighter">02</span>
                        <h2 class="font-extrabold text-[20px] text-[#1a1a1a] tracking-tight">Rincian Pembayaran</h2>
                    </div>

                    <div class="bg-[#f6f4f0] rounded-[20px] p-5 shadow-sm">
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-[#6b6b6b] text-[14px] font-medium">Subtotal</span>
                            <span id="subtotal-price" class="text-[#1a1a1a] font-bold text-[14px]">Rp 0</span>
                        </div>
                        
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-[#6b6b6b] text-[14px] font-medium flex items-center gap-1.5">
                                Biaya Lainnya <i class="fa-regular fa-circle-question text-[11px]"></i>
                            </span>
                            <span id="fee-price" class="text-[#1a1a1a] font-bold text-[14px]">Rp 0</span>
                        </div>

                        <div class="flex justify-between items-center mb-4 pb-4 border-b border-[#e5dfd3]">
                            <span class="text-[#6b6b6b] text-[14px] font-medium">Pembulatan</span>
                            <span class="text-[#8c6d46] font-bold text-[14px]">- Rp 0</span>
                        </div>

                        <div class="flex flex-col gap-1 mt-2">
                            <span class="text-[#8c8c8c] text-[10px] font-bold tracking-widest uppercase">TOTAL BAYAR</span>
                            <span id="total-price" class="font-extrabold text-[32px] text-[#940a16] leading-none tracking-tight">Rp 0</span>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-[20px] p-5 shadow-[0_4px_20px_rgba(0,0,0,0.03)] border border-[#f0ede6] relative z-10 mb-8">
                    <div class="flex items-center gap-2 mb-4">
                        <i class="fa-solid fa-user-pen text-[#940a16] text-[14px]"></i>
                        <h3 class="font-bold text-[14px] text-[#1a1a1a]">Data Pemesan</h3>
                    </div>
                    <div class="flex flex-col gap-3">
                        <input id="customer-name" class="w-full bg-[#f6f4f0] rounded-xl p-3.5 text-[13px] focus:outline-none focus:ring-1 focus:ring-[#a5151b]" placeholder="Nama kamu">
                        <input id="customer-phone" class="w-full bg-[#f6f4f0] rounded-xl p-3.5 text-[13px] focus:outline-none focus:ring-1 focus:ring-[#a5151b]" placeholder="Nomor HP" inputmode="tel">
                        <textarea id="customer-address" class="w-full bg-[#f6f4f0] rounded-xl p-3.5 text-[13px] h-20 resize-none focus:outline-none focus:ring-1 focus:ring-[#a5151b]" placeholder="Alamat / keterangan pengambilan"></textarea>
                    </div>
                </div>

                <div class="bg-white rounded-[20px] p-5 shadow-[0_4px_20px_rgba(0,0,0,0.03)] border border-[#f0ede6] relative z-10 mb-8">
                    <div class="flex items-center gap-2 mb-3">
                        <i class="fa-solid fa-pen-to-square text-[#940a16] text-[14px]"></i>
                        <h3 class="font-bold text-[14px] text-[#1a1a1a]">Catatan Pesanan</h3>
                    </div>
                    <textarea placeholder="Contoh: Tolong daun bawang dipisah ya..." 
                              class="w-full bg-[#f6f4f0] rounded-xl p-3.5 text-[13px] text-gray-800 placeholder-gray-400 h-20 focus:outline-none focus:ring-1 focus:ring-[#a5151b] resize-none"></textarea>
                </div>
            </div>

        </div>

        <div class="fixed bottom-0 w-full max-w-[414px] bg-gradient-to-t from-[#fbf8f4] via-[#fbf8f4] to-transparent pt-10 pb-6 px-6 z-30">
            <button id="pay-btn" class="w-full bg-[#8c0a13] text-white rounded-[14px] py-4 px-6 flex justify-between items-center shadow-[0_8px_25px_rgba(140,10,19,0.35)] transition-transform active:scale-[0.98] disabled:opacity-50">
                <span class="font-bold text-[16px] tracking-wide">Lanjut Pembayaran</span>
                <i class="fa-solid fa-arrow-right text-[15px]"></i>
            </button>
        </div>

    </div>

    <script src="cart.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const saved = getCustomer();
            document.getElementById('customer-name').value = saved.name || '';
            document.getElementById('customer-phone').value = saved.phone || '';
            document.getElementById('customer-address').value = saved.address || '';
            renderOrder();
            document.getElementById('pay-btn').addEventListener('click', () => {
                if (!getCart().length) return;
                const customer = {
                    name: document.getElementById('customer-name').value.trim(),
                    phone: document.getElementById('customer-phone').value.trim(),
                    address: document.getElementById('customer-address').value.trim(),
                    note: document.querySelector('#summary-section textarea').value.trim()
                };
                if (!customer.name || !customer.phone) { alert('Isi nama dan nomor HP dulu ya.'); return; }
                saveCustomer(customer);
                window.location.href = 'Paymentpage.html';
            });
        });

        function renderOrder() {
            const cart = getCart(), listEl = document.getElementById('order-list'), emptyEl = document.getElementById('empty-cart'), summaryEl = document.getElementById('summary-section'), payBtn = document.getElementById('pay-btn');
            if (!cart.length) { listEl.innerHTML=''; emptyEl.classList.remove('hidden'); summaryEl.classList.add('hidden'); payBtn.disabled=true; updatePrices(); return; }
            emptyEl.classList.add('hidden'); summaryEl.classList.remove('hidden'); payBtn.disabled=false;
            listEl.innerHTML = cart.map(item => `
                <div class="flex gap-4 items-center item-row" data-cart-id="${item.cartId}">
                    <img src="${item.image}" alt="${item.name}" class="w-[85px] h-[85px] rounded-[20px] object-cover shadow-md border border-gray-100">
                    <div class="flex-1"><h3 class="font-extrabold text-[16px] text-[#1a1a1a] leading-tight mb-1">${item.name}</h3><p class="font-bold text-[#940a16] text-[14px] mb-1">${formatRupiah(item.price)}</p><p class="text-[#6b6b6b] text-[12px] font-medium leading-snug">${item.variant || ''}</p>
                        <div class="flex items-center gap-3 mt-3"><button class="btn-minus w-7 h-7 rounded-full bg-[#e8e4db] flex items-center justify-center"><i class="fa-solid fa-minus text-[10px]"></i></button><span class="qty-val font-bold text-[14px] w-3 text-center">${item.qty}</span><button class="btn-plus w-7 h-7 rounded-full bg-[#a5151b] flex items-center justify-center text-white shadow-md"><i class="fa-solid fa-plus text-[10px]"></i></button></div>
                    </div>
                </div>`).join('');
            listEl.querySelectorAll('.item-row').forEach(row=>{ const id=row.dataset.cartId, q=row.querySelector('.qty-val'); row.querySelector('.btn-plus').onclick=()=>{updateCartQty(id,parseInt(q.textContent)+1);renderOrder()}; row.querySelector('.btn-minus').onclick=()=>{updateCartQty(id,parseInt(q.textContent)-1);renderOrder()}; });
            updatePrices();
        }
        function updatePrices(){ const subtotal=getCartSubtotal(), fee=subtotal?5000:0; document.getElementById('subtotal-price').innerText=formatRupiah(subtotal); document.getElementById('fee-price').innerText=formatRupiah(fee); document.getElementById('total-price').innerText=formatRupiah(subtotal+fee); }
    </script>
</body>
</html>
